[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pingera-sdk"
# Single source of truth for the SDK version; generate_client.py passes it to the generator.
version = "1.1.0"
description = "Official Python SDK for the Pingera monitoring and status page platform API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Pingera Team", email = "privet@pingera.ru"},
]
requires-python = ">=3.10"
dependencies = [
    "urllib3>=2.7.0,<3.0.0",
    "python-dateutil>=2.8.2",
    "pydantic>=2.11",
    "typing-extensions>=4.7.1",
]
keywords = ["pingera", "monitoring", "uptime", "status-page", "incidents", "synthetic-monitoring", "api", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://pingera.ru"
Documentation = "https://docs.pingera.ru/devs/sdk"
"API Reference" = "https://docs.pingera.ru/api/overview"
Repository = "https://github.com/pingera/pingera-python-sdk"
Issues = "https://github.com/pingera/pingera-python-sdk/issues"
Changelog = "https://github.com/pingera/pingera-python-sdk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["client"]
include = ["pingera", "pingera.*"]

[tool.setuptools.package-data]
pingera = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
